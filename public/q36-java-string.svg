  <circle cx="44" cy="22" r="6" fill="#F59E0B" />
  <circle cx="64" cy="22" r="6" fill="#10B981" />
  
  <!-- Title / Language Badge -->
  <text x="380" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Java String Immutability &amp; Reassignment</text>
  <rect x="680" y="11" width="64" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="712" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">JAVA</text>
  
  <!-- Code Content -->
  <g font-family="Consolas, Monaco, 'Fira Code', 'Courier New', monospace" font-size="15" xml:space="preserve">
    <text x="30" y="74" fill="#475569" text-anchor="end" font-size="13">1</text>
    <text x="52" y="74"><tspan fill="#C084FC" font-weight="700">public class </tspan><tspan fill="#60A5FA" font-weight="400">TestApp {</tspan></text>
    <text x="30" y="102" fill="#475569" text-anchor="end" font-size="13">2</text>
    <text x="52" y="102"><tspan fill="#C084FC" font-weight="700">    public static void </tspan><tspan fill="#E2E8F0" font-weight="400">main(String[] args) {</tspan></text>
    <text x="30" y="130" fill="#475569" text-anchor="end" font-size="13">3</text>
    <text x="52" y="130"><tspan fill="#E2E8F0" font-weight="400">        String s1 = </tspan><tspan fill="#FDE047" font-weight="400">&quot;Data&quot;;</tspan></text>
    <text x="30" y="158" fill="#475569" text-anchor="end" font-size="13">4</text>
    <text x="52" y="158"><tspan fill="#E2E8F0" font-weight="400">        String s2 = s1.concat(</tspan><tspan fill="#FDE047" font-weight="400">&quot;Valley&quot;);</tspan></text>
    <text x="30" y="186" fill="#475569" text-anchor="end" font-size="13">5</text>
    <text x="52" y="186"><tspan fill="#E2E8F0" font-weight="400">        s1.concat(</tspan><tspan fill="#FDE047" font-weight="400">&quot;Platform&quot;);</tspan></text>
    <text x="30" y="214" fill="#475569" text-anchor="end" font-size="13">6</text>
    <text x="52" y="214" fill="#E2E8F0"></text>
    <text x="30" y="242" fill="#475569" text-anchor="end" font-size="13">7</text>
    <text x="52" y="242"><tspan fill="#38BDF8" font-weight="400">        System.out.println(s1 + &quot; &quot; + s2);</tspan></text>
    <text x="30" y="270" fill="#475569" text-anchor="end" font-size="13">8</text>
    <text x="52" y="270"><tspan fill="#E2E8F0" font-weight="400">    }</tspan></text>
    <text x="30" y="298" fill="#475569" text-anchor="end" font-size="13">9</text>
    <text x="52" y="298"><tspan fill="#E2E8F0" font-weight="400">}</tspan></text>
