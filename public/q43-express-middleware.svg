    <text x="52" y="242"><tspan fill="#38BDF8" font-weight="400">  console.log(&quot;M1-End&quot;);</tspan></text>
    <text x="30" y="270" fill="#475569" text-anchor="end" font-size="13">8</text>
    <text x="52" y="270"><tspan fill="#C084FC" font-weight="700">});</tspan></text>
    <text x="30" y="298" fill="#475569" text-anchor="end" font-size="13">9</text>
    <text x="52" y="298" fill="#E2E8F0"></text>
    <text x="30" y="326" fill="#475569" text-anchor="end" font-size="13">10</text>
    <text x="52" y="326"><tspan fill="#34D399" font-weight="700">app.get(&quot;/data&quot;, (req, res) =&gt; {</tspan></text>
    <text x="30" y="354" fill="#475569" text-anchor="end" font-size="13">11</text>
    <text x="52" y="354"><tspan fill="#34D399" font-weight="400">  console.log(&quot;Handler&quot;);</tspan></text>
