    <text x="30" y="74" fill="#475569" text-anchor="end" font-size="13">1</text>
    <text x="52" y="74"><tspan fill="#94A3B8" font-weight="400">const express = require(&quot;express&quot;);</tspan></text>
    <text x="30" y="102" fill="#475569" text-anchor="end" font-size="13">2</text>
    <text x="52" y="102"><tspan fill="#94A3B8" font-weight="400">const app = express();</tspan></text>
