    <text x="30" y="158" fill="#475569" text-anchor="end" font-size="13">4</text>
    <text x="52" y="158"><tspan fill="#C084FC" font-weight="700">app.use((req, res, next) =&gt; {</tspan></text>
    <text x="30" y="186" fill="#475569" text-anchor="end" font-size="13">5</text>
    <text x="52" y="186"><tspan fill="#38BDF8" font-weight="400">  console.log(&quot;M1-Start&quot;);</tspan></text>
