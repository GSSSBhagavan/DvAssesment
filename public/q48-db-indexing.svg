<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="100%" height="100%">
  <rect width="100%" height="100%" rx="14" fill="#0F172A" />
  
  <!-- Window Header -->
  <rect width="100%" height="44" rx="14" fill="#1E293B" />
  <rect y="38" width="100%" height="6" fill="#1E293B" />
  <line x1="0" y1="44" x2="760" y2="44" stroke="#334155" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#EF4444" />
  <circle cx="44" cy="22" r="6" fill="#F59E0B" />
  <circle cx="64" cy="22" r="6" fill="#10B981" />
  
  <!-- Title / Language Badge -->
  <text x="380" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Database B-Tree Index SARGability &amp; Query Optimization</text>
  <rect x="680" y="11" width="64" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="712" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">POSTGRESQL</text>
  
  <!-- Code Content -->
  <g font-family="Consolas, Monaco, 'Fira Code', 'Courier New', monospace" font-size="15" xml:space="preserve">
    <text x="30" y="74" fill="#475569" text-anchor="end" font-size="13">1</text>
    <text x="52" y="74"><tspan fill="#94A3B8" font-weight="400">-- B-Tree Index definition:</tspan></text>
    <text x="30" y="102" fill="#475569" text-anchor="end" font-size="13">2</text>
    <text x="52" y="102"><tspan fill="#C084FC" font-weight="700">CREATE INDEX </tspan><tspan fill="#38BDF8" font-weight="400">idx_created_at </tspan><tspan fill="#C084FC" font-weight="700">ON </tspan><tspan fill="#E2E8F0" font-weight="400">assessment_logs (created_at);</tspan></text>
    <text x="30" y="130" fill="#475569" text-anchor="end" font-size="13">3</text>
    <text x="52" y="130" fill="#E2E8F0"></text>
    <text x="30" y="158" fill="#475569" text-anchor="end" font-size="13">4</text>
    <text x="52" y="158"><tspan fill="#94A3B8" font-weight="400">-- Query 1:</tspan></text>
    <text x="30" y="186" fill="#475569" text-anchor="end" font-size="13">5</text>
    <text x="52" y="186"><tspan fill="#E2E8F0" font-weight="400">SELECT * FROM assessment_logs WHERE created_at &gt;= </tspan><tspan fill="#34D399" font-weight="400">&apos;2026-01-01&apos;;</tspan></text>
    <text x="30" y="214" fill="#475569" text-anchor="end" font-size="13">6</text>
    <text x="52" y="214" fill="#E2E8F0"></text>
    <text x="30" y="242" fill="#475569" text-anchor="end" font-size="13">7</text>
    <text x="52" y="242"><tspan fill="#94A3B8" font-weight="400">-- Query 2:</tspan></text>
    <text x="30" y="270" fill="#475569" text-anchor="end" font-size="13">8</text>
    <text x="52" y="270"><tspan fill="#E2E8F0" font-weight="400">SELECT * FROM assessment_logs WHERE </tspan><tspan fill="#F59E0B" font-weight="700">EXTRACT</tspan><tspan fill="#E2E8F0" font-weight="400">(YEAR FROM created_at) = 2026;</tspan></text>
  </g>
</svg>