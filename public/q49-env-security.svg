<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="100%" height="100%">
  <rect width="100%" height="100%" rx="14" fill="#0F172A" />
  
  <!-- Window Header -->
  <rect width="100%" height="44" rx="14" fill="#1E293B" />
  <rect y="38" width="100%" height="6" fill="#1E293B" />
  <line x1="0" y1="44" x2="760" y2="44" stroke="#334155" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#EF4444" />
  <circle cx="44" cy="22" r="6" fill="#F59E0B" />
  <circle cx="64" cy="22" r="6" fill="#10B981" />
  
  <!-- Title / Language Badge -->
  <text x="380" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Environment Variable Security: Client Bundles vs Server Runtime</text>
  <rect x="680" y="11" width="64" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="712" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">DOTENV CONFIG</text>
  
  <!-- Code Content -->
  <g font-family="Consolas, Monaco, 'Fira Code', 'Courier New', monospace" font-size="15" xml:space="preserve">
    <text x="30" y="74" fill="#475569" text-anchor="end" font-size="13">1</text>
    <text x="52" y="74"><tspan fill="#94A3B8" font-weight="400"># Frontend client-exposed build variables (Inlined into JS bundles)</tspan></text>
    <text x="30" y="102" fill="#475569" text-anchor="end" font-size="13">2</text>
    <text x="52" y="102"><tspan fill="#38BDF8" font-weight="400">NEXT_PUBLIC_APP_TITLE</tspan><tspan fill="#FDE047" font-weight="400">=&quot;Data Valley Assessment Platform&quot;</tspan></text>
    <text x="30" y="130" fill="#475569" text-anchor="end" font-size="13">3</text>
    <text x="52" y="130"><tspan fill="#38BDF8" font-weight="400">NEXT_PUBLIC_API_URL</tspan><tspan fill="#FDE047" font-weight="400">=&quot;https://api.datavalley.ai&quot;</tspan></text>
    <text x="30" y="158" fill="#475569" text-anchor="end" font-size="13">4</text>
    <text x="52" y="158"><tspan fill="#38BDF8" font-weight="400">NEXT_PUBLIC_ENABLE_PROCTORING</tspan><tspan fill="#FDE047" font-weight="400">=&quot;true&quot;</tspan></text>
    <text x="30" y="186" fill="#475569" text-anchor="end" font-size="13">5</text>
    <text x="52" y="186" fill="#E2E8F0"></text>
    <text x="30" y="214" fill="#475569" text-anchor="end" font-size="13">6</text>
    <text x="52" y="214"><tspan fill="#94A3B8" font-weight="400"># Server-only secure secrets (Never bundled or exposed to browsers)</tspan></text>
    <text x="30" y="242" fill="#475569" text-anchor="end" font-size="13">7</text>
    <text x="52" y="242"><tspan fill="#EF4444" font-weight="700">MONGODB_URI</tspan><tspan fill="#F87171" font-weight="400">=&quot;mongodb+srv://admin:pass@cluster.mongodb.net/prod&quot;</tspan></text>
    <text x="30" y="270" fill="#475569" text-anchor="end" font-size="13">8</text>
    <text x="52" y="270"><tspan fill="#EF4444" font-weight="700">JWT_SECRET</tspan><tspan fill="#F87171" font-weight="400">=&quot;super-secure-production-jwt-token-string-32&quot;</tspan></text>
  </g>
</svg>