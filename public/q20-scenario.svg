<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC" />
  <rect x="150" y="50" width="500" height="300" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  <g font-family="system-ui, sans-serif" fill="#1E293B">
    <text x="400" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#64748B">PERFORMANCE REVIEW</text>
    <rect x="200" y="130" width="400" height="150" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
