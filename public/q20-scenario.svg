    <text x="230" y="210" font-size="16" font-style="italic" fill="#1E3A8A">"Your technical work is good, but</text>
    <text x="230" y="235" font-size="16" font-style="italic" fill="#1E3A8A">your progress updates are</text>
    <text x="230" y="260" font-size="16" font-style="italic" fill="#1E3A8A">sometimes unclear or late."</text>
