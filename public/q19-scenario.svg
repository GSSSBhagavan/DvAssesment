<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC" />
  <rect x="100" y="50" width="600" height="300" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  <g font-family="system-ui, sans-serif" fill="#1E293B">
    <text x="400" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">TEAM DISCUSSION</text>
    <line x1="150" y1="110" x2="650" y2="110" stroke="#F1F5F9" stroke-width="2" />
    <rect x="150" y="140" width="230" height="80" rx="8" fill="#F1F5F9" />
    <text x="170" y="170" font-size="14" font-weight="bold" fill="#3B82F6">Developer A:</text>
    <text x="170" y="195" font-size="14">"Approach A is better."</text>
    <rect x="420" y="140" width="230" height="80" rx="8" fill="#F1F5F9" />
    <text x="440" y="170" font-size="14" font-weight="bold" fill="#8B5CF6">Developer B:</text>
    <text x="440" y="195" font-size="14">"Approach B is better."</text>
    <rect x="150" y="250" width="500" height="50" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <text x="400" y="280" font-size="14" font-weight="bold" text-anchor="middle" fill="#DC2626">Team discussion has become unproductive.</text>
  </g>
</svg>