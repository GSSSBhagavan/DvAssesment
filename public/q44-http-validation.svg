<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <rect width="100%" height="100%" rx="14" fill="#0F172A" />
  
  <!-- Window Header -->
  <rect width="100%" height="44" rx="14" fill="#1E293B" />
  <rect y="38" width="100%" height="6" fill="#1E293B" />
  <line x1="0" y1="44" x2="760" y2="44" stroke="#334155" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#EF4444" />
  <circle cx="44" cy="22" r="6" fill="#F59E0B" />
  <circle cx="64" cy="22" r="6" fill="#10B981" />
  
  <!-- Title / Language Badge -->
  <text x="380" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">REST API Request Payload Semantic Validation</text>
  <rect x="680" y="11" width="64" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="712" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">HTTP/REST</text>
  
  <!-- Code Content -->
  <g font-family="Consolas, Monaco, 'Fira Code', 'Courier New', monospace" font-size="15" xml:space="preserve">
    <text x="30" y="74" fill="#475569" text-anchor="end" font-size="13">1</text>
    <text x="52" y="74"><tspan fill="#38BDF8" font-weight="700">POST /api/v1/candidates HTTP/1.1</tspan></text>
    <text x="30" y="102" fill="#475569" text-anchor="end" font-size="13">2</text>
    <text x="52" y="102"><tspan fill="#94A3B8" font-weight="400">Host: api.datavalley.ai</tspan></text>
    <text x="30" y="130" fill="#475569" text-anchor="end" font-size="13">3</text>
    <text x="52" y="130"><tspan fill="#94A3B8" font-weight="400">Content-Type: application/json</tspan></text>
    <text x="30" y="158" fill="#475569" text-anchor="end" font-size="13">4</text>
    <text x="52" y="158" fill="#E2E8F0"></text>
    <text x="30" y="186" fill="#475569" text-anchor="end" font-size="13">5</text>
    <text x="52" y="186"><tspan fill="#E2E8F0" font-weight="400">{</tspan></text>
    <text x="30" y="214" fill="#475569" text-anchor="end" font-size="13">6</text>
    <text x="52" y="214"><tspan fill="#E2E8F0" font-weight="400">  &quot;fullName&quot;: &quot;Jane Doe&quot;,</tspan></text>
    <text x="30" y="242" fill="#475569" text-anchor="end" font-size="13">7</text>
    <text x="52" y="242"><tspan fill="#E2E8F0" font-weight="400">  &quot;graduationYear&quot;: </tspan><tspan fill="#EF4444" font-weight="400">&quot;two-thousand-twenty-five&quot;</tspan><tspan fill="#F87171" font-weight="400">  // Expected integer (2025)</tspan></text>
    <text x="30" y="270" fill="#475569" text-anchor="end" font-size="13">8</text>
    <text x="52" y="270"><tspan fill="#E2E8F0" font-weight="400">}</tspan></text>
    <text x="30" y="298" fill="#475569" text-anchor="end" font-size="13">9</text>
    <text x="52" y="298" fill="#E2E8F0"></text>
    <text x="30" y="326" fill="#475569" text-anchor="end" font-size="13">10</text>
    <text x="52" y="326"><tspan fill="#94A3B8" font-weight="400">HTTP/1.1 </tspan><tspan fill="#F59E0B" font-weight="700">[ ??? Status Code ??? ]</tspan></text>
    <text x="30" y="354" fill="#475569" text-anchor="end" font-size="13">11</text>
    <text x="52" y="354"><tspan fill="#FDE047" font-weight="400">{&quot;error&quot;: &quot;Validation failed: graduationYear must be an integer&quot;}</tspan></text>
  </g>
</svg>